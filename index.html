<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,
  initial-scale=1.0" />
    <title>CAFI Student Portal — Support</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0;
  padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
  Roboto, sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 48px 16px;
      }

      header {
        text-align: center;
        margin-bottom: 40px;
      }

      header h1 {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      header p {
        margin-top: 8px;
        color: #6e6e73;
        font-size: 1rem;
      }

      .card {
        background: #fff;
        border-radius: 18px;
        padding: 36px;
        width: 100%;
        max-width: 520px;
        box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      }

      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 6px;
        color: #3a3a3c;
      }

      input, textarea, select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d1d1d6;
        border-radius: 10px;
        font-size: 1rem;
        font-family: inherit;
        background: #fafafa;
        margin-bottom: 20px;
        transition: border-color 0.2s;
      }

      input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: #0071e3;
        background: #fff;
      }

      textarea {
        height: 140px;
        resize: vertical;
      }

      button[type="submit"] {
        width: 100%;
        padding: 14px;
        background: #0071e3;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.2s;
      }

      button[type="submit"]:hover { background: #0077ed; }
      button[type="submit"]:active { background: #006edb; }

      .success {
        display: none;
        text-align: center;
        padding: 24px 0 8px;
      }

      .success h2 { font-size: 1.3rem; margin-bottom: 8px; }
      .success p { color: #6e6e73; }

      footer {
        margin-top: 32px;
        font-size: 0.8rem;
        color: #aeaeb2;
        text-align: center;
      }
    </style>
  </head>
  <body>

    <header>
      <h1>CAFI Student Portal</h1>
      <p>Need help? We'll get back to you as soon as possible.</p>
    </header>

    <div class="card">
      <form id="support-form" 
  action="https://formspree.io/f/xreyeglj" method="POST">

        <label for="name">Your name</label>
        <input type="text" id="name" name="name" placeholder="Jane
  Smith" required />

        <label for="email">Email address</label>
        <input type="email" id="email" name="email" 
  placeholder="jane@example.com" required />

        <label for="subject">Topic</label>
        <select id="subject" name="subject" required>
          <option value="" disabled selected>Select a topic…</option>
          <option value="login">Login / account access</option>
          <option value="account">Account settings</option>
          <option value="bug">Bug report</option>
          <option value="other">Other</option>
        </select>

        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Describe your
   issue…" required></textarea>

        <button type="submit">Send message</button>
      </form>

      <div class="success" id="success-msg">
        <h2>Message sent!</h2>
        <p>Thanks for reaching out. We'll reply to your email
  shortly.</p>
      </div>
    </div>

    <script>
      const form = document.getElementById('support-form');
      const success = document.getElementById('success-msg');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = new FormData(form);
        const res = await fetch(form.action, {
          method: 'POST',
          body: data,
          headers: { Accept: 'application/json' }
        });
        if (res.ok) {
          form.style.display = 'none';
          success.style.display = 'block';
        } else {
          alert('Something went wrong. Please try again.');
        }
      });
    </script>

  </body>
  </html>
